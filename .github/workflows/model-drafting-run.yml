name: Model drafting run (manual test)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Require the test branch
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/feat/meeting-model-validator" ]; then
            echo "This workflow runs only on feat/meeting-model-validator"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        working-directory: app
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Draft source 1 (transcript)
        working-directory: app
        env:
          ANTHROPIC_DRAFTING_TEST_KEY: ${{ secrets.ANTHROPIC_DRAFTING_TEST_KEY }}
        run: bun run scripts/model-drafting-run.ts scripts/model-run-sources/Agency_Internal_Call_2026-11-27_transcript.txt transcript 2026-11-27 ../out/Agency_Internal_Call_2026-11-27_transcript
      - name: Draft source 2 (notes)
        if: ${{ !cancelled() }}
        working-directory: app
        env:
          ANTHROPIC_DRAFTING_TEST_KEY: ${{ secrets.ANTHROPIC_DRAFTING_TEST_KEY }}
        run: bun run scripts/model-drafting-run.ts scripts/model-run-sources/Strata_Liaison_Notes_2026-11-30_notes.txt notes 2026-11-30 ../out/Strata_Liaison_Notes_2026-11-30_notes
      - name: Upload outputs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: model-drafting-outputs
          path: out/
          retention-days: 7
