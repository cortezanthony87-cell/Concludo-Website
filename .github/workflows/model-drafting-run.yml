name: Model drafting run (manual test)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Require the test branch
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/feat/meeting-model-validator" ]; then
            echo "This workflow runs only on feat/meeting-model-validator"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        working-directory: app
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Draft every source in the manifest (one call each, no retries)
        working-directory: app
        env:
          ANTHROPIC_DRAFTING_TEST_KEY: ${{ secrets.ANTHROPIC_DRAFTING_TEST_KEY }}
        run: |
          set +e
          status=0
          # manifest.tsv: one line per source: <file name> <tab> <transcript|notes|document> <tab> <YYYY-MM-DD>
          while IFS=$'\t' read -r file kind date; do
            [ -z "$file" ] && continue
            case "$file" in \#*) continue ;; esac
            out="../out/${file%.*}"
            bun run scripts/model-drafting-run.ts "scripts/model-run-sources/$file" "$kind" "$date" "$out" || status=1
          done < scripts/model-run-sources/manifest.tsv
          exit $status
      - name: Upload outputs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: model-drafting-outputs
          path: out/
          retention-days: 7
